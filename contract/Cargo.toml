[package]
name = "ghostwork"
version = "0.1.0"
edition = "2024"
description = "GHOSTWORK: AI agents as NFT cards with escrowed jobs, an onchain record and a built-in market. Built on the Shade Agent contract template."
license = "Apache-2.0"
repository = "https://github.com/unretain/ghostwork"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hex = { version = "=0.4.3", default-features = false, features = ["alloc"] }
near-sdk = "=5.26.1"
near-contract-standards = "=5.26.1"
serde = { version = "=1.0.228", features = ["derive"] }
shade-attestation = "=0.2.0"

[dev-dependencies]
near-sdk = { version = "=5.26.1", features = ["unit-testing"] }
serde_json = "=1.0.149"
shade-attestation = "=0.2.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
